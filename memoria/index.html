<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Memoria</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="memory-app">
  <header class="game-header">
    <a href="../principal.html" class="back">🏠 Inicio</a>
    <div>
      <h1>🧠 Juego de Memoria</h1>
      <p>Encuentra todas las parejas</p>
    </div>
  </header>

  <section class="stats">
    <div><span>⏱️ Tiempo</span><strong id="time">00:00</strong></div>
    <div><span>🎯 Movimientos</span><strong id="moves">0</strong></div>
    <div><span>🧩 Parejas</span><strong id="pairs">0/8</strong></div>
  </section>

  <div id="board" class="board"></div>

  <button id="restart" class="restart">🔄 Nueva partida</button>
  <p id="message" class="message"></p>
</div>
<script src="script.js"></script><script src="audio.js"></script>
</body>
</html>
